spring.application.name=esg-reporting

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/esg_reporting}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.web.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
spring.jpa.database-platform=org.hibernate.dialect.TiDBDialect
spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8080}